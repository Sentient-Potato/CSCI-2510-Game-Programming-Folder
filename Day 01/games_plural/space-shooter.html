<html>
    <head>
        <title>Game Loop</title>
        <style>
            *{
                margin: 0;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <canvas id="canv">

        </canvas>

        <script src = "../engine/Vector2.js"></script>
        <script src = "../engine/Engine.js"></script>
        <script src = "../engine/Input.js"></script>

        <script>
            let canvas = document.querySelector("#canv")
            let ctx = canvas.getContext("2d")


            let position = new Vector2(50, 50)

            function gameLoop() {
                update()
                draw()
                requestAnimationFrame(gameLoop)
            }
            
            function update() {
                //console.log(Input.keysDown) //Debug line, check in console

                if(Input.keysDown.includes("ArrowRight"))
                    position.x = position.x + 1

                if(Input.keysDown.includes("ArrowLeft"))
                    position.x = position.x - 1
                
                if(Input.keysDown.includes("ArrowUp"))
                    position.y = position.y - 1

                if(Input.keysDown.includes("ArrowDown"))
                    position.y = position.y + 1

            }

            function draw(ctx) {
                canvas.width = window.innerWidth
                canvas.height = window.innerHeight

                //This signals to the context that we're going to draw something (Prof note)
                ctx.save()

                //Set center of our object (Prof note)
                ctx.translate(position.x, position.y)

                ctx.lineTo(0,-5)
                ctx.lineTo(15,-20)
                ctx.lineTo(30,10)
                ctx.lineTo(0,50)
                ctx.lineTo(-30,10)
                ctx.lineTo(-15,-20)

                ctx.fillStyle = "Pink"
                ctx.fill()

                //This signals that we're done drawing (Prof note)
                ctx.restore()
            }
            
            Engine.start()
            
        </script>
    </body>
</html>
